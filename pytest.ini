[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers --ignore=dist --ignore=node_modules
norecursedirs = dist .astro .git .tox build *.egg node_modules
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests