name: Build Weekly Digest

on:
  # 毎週月曜 9:30 JST (0:30 UTC)。日曜ぶんの日次記事は当日8:00 JSTに作られるので、
  # その後に走らせて日〜土の7日分をまとめる
  schedule:
    - cron: '30 0 * * 1'
  workflow_dispatch:
    inputs:
      week_ending:
        description: '週の最終日 (YYYY-MM-DD)。既定は日本時間の昨日'
        required: false

permissions:
  contents: write
  issues: write

# 日次の更新と同じグループにして、main への push がぶつからないようにする
concurrency:
  group: update-blog
  cancel-in-progress: false

jobs:
  weekly-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
      sha: ${{ steps.commit.outputs.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 要約は日次記事から流用するので、Gemini APIは呼ばない
      - name: Build weekly digest
        run: |
          if [ -n "${{ inputs.week_ending }}" ]; then
            python scripts/build_weekly_digest.py --week-ending "${{ inputs.week_ending }}"
          else
            python scripts/build_weekly_digest.py
          fi

      - name: Check for changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain _posts/)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      # ここから公開前ゲート: 検証を通らなかったものはコミットしない
      - name: Run tests
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: python test_runner.py

      - name: Build Astro site
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Validate build output
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          python scripts/validate_build.py --log build.log --feed dist/feed.xml \
            --dist dist --min-entries 1

      - name: Upload build output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-weekly-build
          path: |
            build.log
            _posts/
          if-no-files-found: ignore

      # 検証を通ったのでコミットして push する。
      # GITHUB_TOKEN による push は deploy.yml の push トリガーを起動しないので、
      # 公開はこの後の deploy ジョブから明示的に呼ぶ
      - name: Commit and push changes
        id: commit
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add _posts/
          git commit -m "自動更新: 週刊まとめを追加 $(date '+%Y-%m-%d %H:%M:%S')"

          # 実行中に main が進んでいると push が落ち、生成した記事が失われる。
          # rebase しながら数回まで再試行する
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              echo "pushed=true" >> $GITHUB_OUTPUT
              echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "push に失敗しました (試行 ${attempt}/4)。rebase して再試行します"
            sleep $((attempt * 5))
            git pull --rebase origin main
          done
          echo "push に繰り返し失敗しました" >&2
          exit 1

      # 無人運用なので、失敗したら気づけるように自動でissueを立てる
      - name: Report failure as issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create automation-failure --color B60205 \
            --description "自動更新ワークフローの失敗" 2>/dev/null || true

          body="週刊まとめの生成が失敗しました。検証を通らなかったため、記事のコミットと公開は行われていません。

          - 実行ログ: ${RUN_URL}
          - 生成物は artifact \`failed-weekly-build\` に保存されています

          再実行する場合は Actions から \`Build Weekly Digest\` を workflow_dispatch してください。"

          existing=$(gh issue list --label automation-failure --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "週刊まとめの生成が失敗しました" \
              --label automation-failure --body "$body"
          fi

  # push しただけでは公開されないので、ここから Pages へのデプロイを呼ぶ
  deploy:
    needs: weekly-digest
    if: needs.weekly-digest.outputs.pushed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.weekly-digest.outputs.sha }}

  # 記事はコミット済みなのに公開だけ落ちた状態に気づけるようにする
  report-deploy-failure:
    needs: deploy
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Report failure as issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create automation-failure --color B60205 \
            --description "自動更新ワークフローの失敗" 2>/dev/null || true

          body="週刊まとめのコミットは成功しましたが、GitHub Pages への公開に失敗しました。

          - 実行ログ: ${RUN_URL}

          再実行する場合は Actions から \`Deploy Astro site to Pages\` を workflow_dispatch してください。"

          existing=$(gh issue list --label automation-failure --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "週刊まとめの公開に失敗しました" \
              --label automation-failure --body "$body"
          fi
