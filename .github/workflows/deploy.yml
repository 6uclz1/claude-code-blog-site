# Astro でビルドしたサイトを GitHub Pages に公開するワークフロー
name: Deploy Astro site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # 自動更新ワークフローから呼び出すための入口。
  # GITHUB_TOKEN による push は他のワークフローを起動しない（再帰実行の防止）ので、
  # 上の push トリガーでは自動生成された記事が永久に公開されない
  workflow_call:
    inputs:
      ref:
        description: 'ビルドするコミット。未指定ならイベント既定のref'
        required: false
        type: string

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 呼び出し元は push したばかりのコミットを渡す。
          # push / workflow_dispatch では空になり、既定のrefが使われる
          ref: ${{ inputs.ref }}
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build with Astro
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      # ビルドが成功しても記事が壊れたまま公開されることがあるため、
      # ビルドログと feed.xml を検査してから公開する
      - name: Validate build output
        run: |
          python scripts/validate_build.py --log build.log --feed dist/feed.xml \
            --dist dist --min-entries 1
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: astro-build-log
          path: build.log
          if-no-files-found: ignore
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
