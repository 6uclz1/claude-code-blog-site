name: Run Tests

on:
  pull_request:
    branches: [ main ]
  # main への push では deploy.yml が同じビルドと検証を実行するため、
  # ここで走らせると同じ内容を二重にビルドすることになる
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # python-scripts サービスは image 指定だけでビルド対象を持たないため、
      # Docker を挟まずランナー上で直接実行する（依存のキャッシュも効く）
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: python test_runner.py --coverage

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Run frontend tests
        run: npm test

      - name: Build with Astro
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      # ビルドが成功しても記事が壊れたままマージされることがあるため、
      # ビルドログと feed.xml を検査する
      - name: Validate build output
        run: |
          python scripts/validate_build.py --log build.log --feed dist/feed.xml \
            --dist dist

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: astro-build-log
          path: build.log
          if-no-files-found: ignore
