name: Run Tests

on:
  pull_request:
    branches: [ main ]
  # main への push では deploy.yml が同じビルドと検証を実行するため、
  # ここで走らせると同じ内容を二重にビルドすることになる
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      # src/lib の純粋なモジュールと scripts/ の自動化スクリプトをまとめて検証する
      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build with Astro
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      # ビルドが成功しても記事が壊れたままマージされることがあるため、
      # ビルドログと feed.xml を検査する
      - name: Validate build output
        run: |
          npm run validate -- --log build.log --feed dist/feed.xml --dist dist

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: astro-build-log
          path: build.log
          if-no-files-found: ignore
