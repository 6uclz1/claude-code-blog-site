services:
  astro:
    build: .
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
    command: npm run dev

  python-scripts:
    image: python:3.11-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: tail -f /dev/null
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}

volumes:
  node_modules:
