services:
  astro:
    build: .
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
    command: npm run dev

  # ローカルで自動化スクリプトを動かすための使い捨てコンテナ。
  # CI ではランナー上で直接実行している（image 指定だけなのでビルド対象を持たない）
  python-scripts:
    image: python:3.11-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: tail -f /dev/null
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # 任意。設定すると r.jina.ai のレート制限が緩和される（未設定でも動作する）
      - JINA_API_KEY=${JINA_API_KEY:-}

volumes:
  node_modules:
